# Node / TypeScript CI template for ci-setup (npm).
# Keep the job name "ci" and do not use a matrix: branch protection requires a check with this exact name.
# Do not add paths filters: a required check that never starts blocks merging.
# Remove steps whose scripts do not exist in package.json. For pnpm / yarn / bun, change install and cache.
name: CI

on:
  push:
    branches: [__DEFAULT_BRANCH__]
  pull_request:
    branches: [__DEFAULT_BRANCH__]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Use node-version-file: '.nvmrc' if the repository has one.
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prefer "npm run typecheck" if it exists. Use "npx tsc -b" if tsconfig.json has "references".
      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
